name: Posts erzeugen

on:
  # Jeden Monat am 25. automatisch die Posts für die nächsten 35 Tage erzeugen.
  schedule:
    - cron: '17 6 25 * *'
  # Manuell starten: GitHub → Actions → "Posts erzeugen" → "Run workflow".
  workflow_dispatch:
    inputs:
      days:
        description: 'Anzahl Tage'
        default: '35'
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  generate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Posts erzeugen
        run: npm run generate -- --days "${DAYS}"
        env:
          # Bei Push/PR nur 3 Tage als Probelauf.
          DAYS: ${{ github.event_name == 'push' && '3' || github.event_name == 'pull_request' && '3' || inputs.days || '35' }}
      - uses: actions/upload-artifact@v4
        with:
          name: posts
          path: output/
          retention-days: 30
